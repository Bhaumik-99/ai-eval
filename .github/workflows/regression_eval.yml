name: Automated Regression Evaluation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  regression-eval:
    name: Evaluate Benchmark Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Regression Benchmark Against Baseline
        env:
          AGENTEVAL_SANDBOX_FALLBACK: "1"
        run: |
          python run_regression_eval.py --baseline benchmarks/baseline.json --threshold 5.0

      - name: Publish Regression Report to Summary
        if: always()
        run: |
          if [ -f reports/regression_report.md ]; then
            cat reports/regression_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Regression Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: reports/
